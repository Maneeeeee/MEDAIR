    <title>DroneAid Armenia — Medical Drone Network</title>
    <meta
      name="description"
      content="Real-time coordination of medical drone deliveries across Armenia — emergency antivenom, blood, lab samples, and cold-chain supplies."
    />
    <script>
      // Apply theme as early as possible to avoid FOUC. Order of
      // precedence matches useTheme.ts:
      //   1. ?theme=dark|light URL override
      //   2. localStorage
      //   3. prefers-color-scheme
      //   4. light
      (function () {
        try {
          var theme;
          try {
            var params = new URLSearchParams(window.location.search);
            var qp = params.get("theme");
            if (qp === "light" || qp === "dark") theme = qp;
          } catch (e) { /* ignore */ }
          if (!theme) {
            var stored = localStorage.getItem("droneaid-theme");
            theme = (stored === "dark" || stored === "light")
              ? stored
              : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          }
          document.documentElement.dataset.theme = theme;
          // Sync the meta theme-color so the browser chrome matches.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#070b14" : "#fbfaf6");
        } catch (e) { /* ignore */ }
      })();
    </script>
